# One-time formatting helper for the Skill Engineering documentation branch.
# This workflow is removed after the formatting commit and is not merged.
name: Format Skill Engineering module

on:
  push:
    branches:
      - docs/agent-skill-engineering-module
    paths:
      - .github/workflows/format-skill-engineering.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/agent-skill-engineering-module
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format only this module's Markdown
        run: npx prettier "content/Computer-Science/11-AI-and-Agent-Engineering/agent/skill-engineering/**/*.md" --write
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "content/Computer-Science/11-AI-and-Agent-Engineering/agent/skill-engineering/"
          if ! git diff --cached --quiet; then
            git commit -m "style: format Skill Engineering articles"
            git push origin HEAD:docs/agent-skill-engineering-module
          fi
